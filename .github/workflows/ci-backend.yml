name: CI - Backend

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: edgeai_test
          POSTGRES_USER: edgeai
          POSTGRES_PASSWORD: edgeai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Build & Test
        working-directory: backend
        run: ./gradlew build
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: edgeai_test
          DB_USERNAME: edgeai
          DB_PASSWORD: edgeai

      # "BUILD SUCCESSFUL" nao distingue passou de pulou, e o teste de
      # isolamento se auto-desabilita sem Docker. Sem este resumo nao da para
      # saber, olhando o log, se a cobertura contra banco real aconteceu.
      - name: Resumo dos testes
        if: always()
        working-directory: backend
        run: python3 scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results/test/
          retention-days: 7
