spring:
  application:
    name: edge-ai-industrial-backend

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edgeai}
    username: ${DB_USERNAME:edgeai}
    password: ${DB_PASSWORD:edgeai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: edge-ai-group
      auto-offset-reset: earliest
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8080}

# MQTT
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:edge-ai-backend}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topics: sensor/data/#, device/status/#

# JWT
jwt:
  secret: ${JWT_SECRET:change-this-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
