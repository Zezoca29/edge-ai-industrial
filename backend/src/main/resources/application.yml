spring:
  application:
    name: edge-ai-industrial-backend

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:edgeai}
    username: ${DB_USERNAME:edgeai}
    password: ${DB_PASSWORD:edgeai}
    driver-class-name: org.postgresql.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: edge-ai-group
      auto-offset-reset: earliest
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8082}

# MQTT
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://broker.emqx.io:1883}
  client-id: ${MQTT_CLIENT_ID:edge-ai-backend}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topics: sensor/data/#, device/status/#

# JWT
jwt:
  secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi1rZXktMzI=}
  expiration: ${JWT_EXPIRATION:86400000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

alerts:
  # REGRA DE DIMENSIONAMENTO: este valor precisa ser de no minimo TRES VEZES o
  # intervalo de despertar do dispositivo mais lento da loja.
  #
  # O firmware do P2 usa deep sleep para nao precisar de fio permanente. Se o
  # limite chegar perto do intervalo de despertar, cada ciclo do aparelho vira
  # abre -> notifica -> resolve -> abre, e o dono passa a receber alerta falso a
  # cada poucos minutos ate ignorar o sistema inteiro. Com 3x, uma unica
  # transmissao perdida ainda nao mata o aparelho.
  #
  # Ha protecao contra oscilacao em DeviceSilenceMonitor (nao reabre dentro de um
  # periodo apos a resolucao), mas ela e a ultima linha de defesa: o numero certo
  # aqui e o que evita o problema. Valor atual (10 min) cobre despertar de ate
  # ~3 min; se o firmware do P2 acordar mais devagar, aumente este numero na
  # mesma proporcao.
  device-silence-minutes: 10

push:
  vapid:
    # Geradas fora do repositorio. Sem elas, o push fica desligado e o alerta
    # continua sendo gravado normalmente.
    public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    subject: mailto:admin@edgeai.local
