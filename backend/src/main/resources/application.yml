spring:
  application:
    name: edge-ai-industrial-backend

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:edgeai}
    username: ${DB_USERNAME:edgeai}
    password: ${DB_PASSWORD:edgeai}
    driver-class-name: org.postgresql.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: edge-ai-group
      auto-offset-reset: earliest
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8082}

# MQTT
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://broker.emqx.io:1883}
  client-id: ${MQTT_CLIENT_ID:edge-ai-backend}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topics: sensor/data/#, device/status/#

# JWT
jwt:
  secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi1rZXktMzI=}
  expiration: ${JWT_EXPIRATION:86400000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

alerts:
  # O firmware do P2 usa deep sleep para nao precisar de fio permanente; um
  # dispositivo que acorda de 5 em 5 minutos nao pode ser dado como morto.
  device-silence-minutes: 10

push:
  vapid:
    # Geradas fora do repositorio. Sem elas, o push fica desligado e o alerta
    # continua sendo gravado normalmente.
    public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    subject: mailto:admin@edgeai.local
