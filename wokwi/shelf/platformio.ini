; Projeto PlatformIO para simular a bancada no Wokwi (VS Code), compilando local.
; src_dir = . faz o PlatformIO compilar o proprio sketch.ino desta pasta —
; sem duplicar o codigo. O wokwi.toml aponta para o binario gerado aqui.
[platformio]
src_dir = .

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bogde/HX711@^0.7.5
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags = -DCORE_DEBUG_LEVEL=0 -DDEMO_NO_NOISE

; env:esp32-2/3/4 sao a mesma bancada, so com DEVICE_ID_STR diferente — a
; frota de 4 esteiras compila do mesmo sketch.ino (src_dir=. acima), um
; binario por esteira em .pio/build/esp32-N/. Ver wokwi/shelf/fleet/.
[env:esp32-2]
extends = env:esp32
build_flags = -DCORE_DEBUG_LEVEL=0 -DDEMO_NO_NOISE -DDEVICE_ID_STR=\"wokwi-shelf-002\"

[env:esp32-3]
extends = env:esp32
build_flags = -DCORE_DEBUG_LEVEL=0 -DDEMO_NO_NOISE -DDEVICE_ID_STR=\"wokwi-shelf-003\"

[env:esp32-4]
extends = env:esp32
build_flags = -DCORE_DEBUG_LEVEL=0 -DDEMO_NO_NOISE -DDEVICE_ID_STR=\"wokwi-shelf-004\"
